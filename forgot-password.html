<!DOCTYPE html>
<html>
<head>
  <title>Forgot Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5" style="max-width:420px">
  <h4 class="text-center mb-3">Lupa Password</h4>

  <form id="forgotForm" class="card p-4">
    <input id="forgotEmail" type="email" class="form-control mb-3" placeholder="Email" required>
    <button class="btn btn-warning w-100">Hantar Email Reset</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-forgot.js"></script>
</body>
</html>
