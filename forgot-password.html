<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Lupa Password | Abang Kucing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3F51B5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ak-auth-page">
  <div class="ak-auth-card">

    <!-- Logo -->
    <div class="ak-auth-header">
      <div class="ak-auth-logo">
        <span class="abang">Abang</span><span class="kucing">Kucing</span>
      </div>
      <div class="ak-auth-tagline">Reset Password</div>
    </div>

    <!-- Form -->
    <form id="forgotForm" class="ak-auth-form">

      <div class="ak-info-box mb-3">
        <i class="bi bi-info-circle"></i>
        <span>Masukkan email anda dan kami akan hantar link untuk reset password.</span>
      </div>

      <div class="ak-form-group">
        <label class="ak-form-label" for="forgotEmail">Email</label>
        <div class="ak-input-icon">
          <i class="bi bi-envelope"></i>
          <input id="forgotEmail" type="email" class="form-control" 
            placeholder="email@contoh.com" required>
        </div>
      </div>

      <button type="submit" class="btn ak-btn-gold w-100">
        <i class="bi bi-send me-2"></i>Hantar Email Reset
      </button>

      <div class="ak-auth-links">
        <a href="login"><i class="bi bi-arrow-left me-1"></i>Kembali ke login</a>
      </div>

    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/pwa.js"></script>
<script src="js/auth-forget.js"></script>
</body>
</html>
