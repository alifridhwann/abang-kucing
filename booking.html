<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking | Abang Kucing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-light shadow-sm">
  <div class="container">
    <span class="navbar-brand abang-kucing-logo">
      <span class="abang">Abang</span><span class="kucing">Kucing</span>
    </span>
    <a href="customer.html" class="btn btn-outline-secondary btn-sm">Dashboard</a>
  </div>
</nav>

<div class="container my-5" style="max-width:700px">

  <div class="mb-4">
    <h4>New Booking</h4>
    <p class="text-muted mb-0">Choose service & confirm your booking</p>
  </div>

  <form id="bookingForm" class="card p-4 shadow-sm">

    <label class="form-label">Service</label>
    <select id="service" class="form-select mb-3" required>
      <option value="">-- Select --</option>
      <option value="Grooming">Grooming</option>
      <option value="Cat Hotel">Cat Hotel</option>
    </select>

    <label class="form-label">Booking Date</label>
    <input type="date" id="date" class="form-control mb-3" required>

    <label class="form-label">Amount (RM)</label>
    <input type="number" id="amount" class="form-control mb-4" required>

    <button class="btn btn-primary w-100">
      Submit Booking
    </button>

  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
document.getElementById('bookingForm').addEventListener('submit', async e => {
  e.preventDefault();

  const { data } = await supabaseClient.auth.getUser();
  if (!data.user) return location.href = 'login.html';

  const { error } = await supabaseClient.from('bookings').insert({
    user_id: data.user.id,
    service: service.value,
    amount: parseInt(amount.value),
    status: 'pending'
  });

  if (error) return alert(error.message);

  alert('Booking submitted');
  location.href = 'customer.html';
});
</script>
</body>
</html>
