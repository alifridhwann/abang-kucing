<!DOCTYPE html>
<html>
<head>
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5" style="max-width:420px">
  <h4 class="text-center mb-3">Reset Password</h4>

  <form id="resetForm" class="card p-4">
    <input id="newPassword" type="password" class="form-control mb-3" placeholder="Password baru" required>
    <button class="btn btn-success w-100">Simpan Password</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-reset.js"></script>
</body>
</html>
