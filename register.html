<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Daftar | Abang Kucing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3F51B5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ak-auth-page">
  <div class="ak-auth-card">

    <!-- Logo -->
    <div class="ak-auth-header">
      <div class="ak-auth-logo">
        <span class="abang">Abang</span><span class="kucing">Kucing</span>
      </div>
      <div class="ak-auth-tagline">Daftar Akaun Baru</div>
    </div>

    <!-- Form -->
    <form id="registerForm" class="ak-auth-form">

      <div class="ak-form-group">
        <label class="ak-form-label" for="regName">Nama Pendek</label>
        <div class="ak-input-icon">
          <i class="bi bi-person"></i>
          <input id="regName" type="text" class="form-control" 
            placeholder="Contoh: Afiq" required>
        </div>
      </div>

      <div class="ak-form-group">
        <label class="ak-form-label" for="regAddress">Tempat Tinggal</label>
        <div class="ak-input-icon">
          <i class="bi bi-geo-alt"></i>
          <input id="regAddress" type="text" class="form-control" 
            placeholder="Contoh: Cabang Tiga" required>
        </div>
      </div>

      <div class="ak-form-group">
        <label class="ak-form-label" for="regEmail">Email</label>
        <div class="ak-input-icon">
          <i class="bi bi-envelope"></i>
          <input id="regEmail" type="email" class="form-control" 
            placeholder="email@contoh.com" required>
        </div>
      </div>

      <div class="ak-form-group">
        <label class="ak-form-label" for="regPassword">Password</label>
        <div class="ak-input-icon">
          <i class="bi bi-lock"></i>
          <input id="regPassword" type="password" class="form-control" 
            placeholder="Minimum 6 aksara" required>
        </div>
      </div>

      <small id="registerError" class="text-danger d-block mb-3"></small>

      <button type="submit" class="btn ak-btn-primary w-100">
        <i class="bi bi-person-plus me-2"></i>Daftar
      </button>

      <div class="ak-auth-links">
        <span>Sudah ada akaun? <a href="login">Log masuk</a></span>
      </div>

    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/pwa.js"></script>
<script src="js/auth-register.js"></script>
</body>
</html>
