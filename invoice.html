<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Invoice | Abang Kucing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3F51B5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ak-app">

  <!-- Header -->
  <header class="ak-header">
    <div class="ak-header-inner">
      <a href="customer" class="ak-back" aria-label="Kembali">
        <i class="bi bi-chevron-left"></i>
      </a>
      <div class="ak-header-title">Invoice</div>
      <div style="width:32px"></div>
    </div>
  </header>

  <main class="ak-content">

    <div id="invoiceContent" class="ak-invoice-card">
      <div class="ak-invoice-row">
        <span class="ak-invoice-label">Servis</span>
        <span class="ak-invoice-value" id="invService">-</span>
      </div>
      <div class="ak-invoice-row">
        <span class="ak-invoice-label">Jumlah</span>
        <span class="ak-invoice-value ak-invoice-amount" id="invAmount">RM0</span>
      </div>
      <div class="ak-invoice-row">
        <span class="ak-invoice-label">Status</span>
        <span class="ak-invoice-value" id="invStatus">-</span>
      </div>
    </div>

    <div id="emptyState" class="ak-empty d-none">
      <i class="bi bi-receipt-cutoff ak-empty-icon"></i>
      <p>Tiada invoice</p>
    </div>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/auth-guard.js"></script>
<script src="js/pwa.js"></script>
<script src="js/invoice.js"></script>
</body>
</html>
