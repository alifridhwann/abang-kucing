<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Login | Abang Kucing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3F51B5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ak-auth-page">
  <div class="ak-auth-card">

    <a href="/" class="ak-back position-absolute top-0 start-0 m-3" aria-label="Kembali ke Home">
      <i class="bi bi-arrow-left"></i>
    </a>

    <!-- Logo -->
    <div class="ak-auth-header">
      <div class="ak-auth-logo">
        <span class="abang">Abang</span><span class="kucing">Kucing</span>
      </div>
      <div class="ak-auth-tagline">Grooming & Cat Hotel</div>
    </div>

    <!-- Form -->
    <form id="loginForm" class="ak-auth-form">

      <div class="ak-form-group">
        <label class="ak-form-label" for="loginEmail">Email</label>
        <div class="ak-input-icon">
          <i class="bi bi-envelope"></i>
          <input id="loginEmail" type="email" class="form-control" 
            placeholder="email@contoh.com" required>
        </div>
      </div>

      <div class="ak-form-group">
        <label class="ak-form-label" for="loginPassword">Password</label>
        <div class="ak-input-icon">
          <i class="bi bi-lock"></i>
          <input id="loginPassword" type="password" class="form-control" 
            placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn ak-btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-2"></i>Log Masuk
      </button>

      <div class="ak-auth-links">
        <a href="register">Daftar akaun baru</a>
        <a href="forgot-password">Lupa password?</a>
      </div>

    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/pwa.js"></script>
<script src="js/auth-login.js"></script>
</body>
</html>
