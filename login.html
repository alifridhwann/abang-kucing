<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Abang Kucing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card auth-card shadow-sm p-4" style="max-width:420px; width:100%">

    <!-- LOGO -->
    <div class="text-center mb-4">
      <div class="abang-kucing-logo">
        <span class="abang">Abang</span>
        <span class="kucing">Kucing</span>
      </div>
      <small class="text-muted">
        Grooming & Cat Hotel
      </small>
    </div>

    <!-- FORM -->
    <form id="loginForm">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input id="loginEmail" type="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input id="loginPassword" type="password" class="form-control" required>
      </div>

      <button class="btn btn-primary w-100 mb-3">
        Login
      </button>

      <div class="text-center small">
        <a href="register.html">Create new account</a><br>
        <a href="forgot-password.html">Forgot password?</a>
      </div>
    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/auth-login.js"></script>
</body>
</html>
