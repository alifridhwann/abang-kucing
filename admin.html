<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin | Abang Kucing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar navbar-light shadow-sm">
  <div class="container">
    <span class="navbar-brand abang-kucing-logo">
      <span class="abang">Abang</span><span class="kucing">Kucing</span>
    </span>
    <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">
      Logout
    </button>
  </div>
</nav>

<div class="container my-5">

  <h4 class="mb-4">Admin Dashboard</h4>

  <div class="card shadow-sm p-4">
    <h6 class="mb-3">Bookings</h6>

    <div class="table-responsive">
      <table class="table align-middle">
        <thead>
          <tr>
            <th>Date</th>
            <th>Service</th>
            <th>User</th>
            <th>Status</th>
            <th class="text-end">Amount</th>
            <th class="text-end">Action</th>
          </tr>
        </thead>
        <tbody id="adminBookings"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
/* =====================================================
   ADMIN BOOKING APPROVAL
   ===================================================== */

async function loadBookings() {
  const { data: bookings, error } = await supabaseClient
    .from('bookings')
    .select('id, created_at, service, status, amount, user_id')
    .order('created_at', { ascending: false });

  if (error) {
    alert(error.message);
    return;
  }

  const tbody = document.getElementById('adminBookings');
  tbody.innerHTML = '';

  bookings.forEach(b => {
    tbody.innerHTML += `
      <tr>
        <td>${new Date(b.created_at).toLocaleDateString()}</td>
        <td>${b.service}</td>
        <td class="text-muted">${b.user_id.slice(0,8)}…</td>
        <td>
          <span class="badge ${
            b.status === 'pending' ? 'bg-warning' :
            b.status === 'confirmed' ? 'bg-success' :
            'bg-danger'
          }">
            ${b.status}
          </span>
        </td>
        <td class="text-end">RM${b.amount}</td>
        <td class="text-end">
          ${
            b.status === 'pending'
            ? `
              <button class="btn btn-sm btn-success me-1"
                onclick="updateStatus('${b.id}','confirmed')">
                Approve
              </button>
              <button class="btn btn-sm btn-danger"
                onclick="updateStatus('${b.id}','cancelled')">
                Reject
              </button>
            `
            : '-'
          }
        </td>
      </tr>
    `;
  });
}

async function updateStatus(id, status) {
  if (!confirm(`Set booking to "${status}"?`)) return;

  const { error } = await supabaseClient
    .from('bookings')
    .update({ status })
    .eq('id', id);

  if (error) {
    alert(error.message);
    return;
  }

  loadBookings();
}

loadBookings();

/* ===== LOGOUT ===== */
logoutBtn.onclick = async () => {
  await supabaseClient.auth.signOut();
  location.href = 'login.html';
};
</script>

</body>
</html>
