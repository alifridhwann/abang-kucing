<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <title>Profil | Abang Kucing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Global Style -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container">
    <a href="customer.html" class="text-decoration-none">
      <span class="abang-kucing-logo">
        <span class="abang">Abang</span><span class="kucing">Kucing</span>
      </span>
    </a>
  </div>
</nav>

<div class="container my-5" style="max-width:500px">

  <h4 class="mb-3">Profil Akaun</h4>

  <form id="profileForm" class="card p-4 shadow-sm">

    <label class="form-label">Nama</label>
    <input id="profileName" type="text"
      class="form-control mb-3" required>

    <label class="form-label">No Telefon</label>
    <input id="profilePhone" type="tel"
      class="form-control mb-3"
      placeholder="Contoh: 0132237553"
      required>

    <label class="form-label">Nama Kampung / Alamat Ringkas</label>
    <input id="profileKampung" type="text"
      class="form-control mb-4"
      placeholder="Contoh: Cabang Tiga"
      required>

    <button class="btn btn-primary w-100">
      Simpan Profil
    </button>

  </form>

</div>

<script src="js/profile.js"></script>
</body>
</html>
