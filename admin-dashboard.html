<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3F51B5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar bg-white shadow-sm">
  <div class="container">
    <span class="navbar-brand">📊 Dashboard Admin</span>
    <a href="admin" class="btn btn-outline-secondary btn-sm">Menu</a>
  </div>
</nav>

<div class="container my-4">
  <div class="row g-3">

    <div class="col-md-4">
      <div class="card p-3 text-center">
        <small class="text-muted">Jumlah Booking</small>
        <h2 id="totalBooking">0</h2>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3 text-center">
        <small class="text-muted">Jumlah Sales (RM)</small>
        <h2 id="totalSales">0</h2>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card p-3 text-center">
        <small class="text-muted">Booking Hari Ini</small>
        <h2 id="todayBooking">0</h2>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/auth-guard-admin.js"></script>
<script src="js/pwa.js"></script>
<script src="js/admin-dashboard.js"></script>
</body>
</html>
