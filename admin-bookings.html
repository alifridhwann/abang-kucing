<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<title>Admin | Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3F51B5">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

<nav class="navbar bg-white shadow-sm">
  <div class="container">
    <span class="navbar-brand">📋 Urus Booking</span>
    <a href="admin" class="btn btn-outline-secondary btn-sm">Menu</a>
  </div>
</nav>

<div class="container my-4">

  <div class="card mb-3 p-3">
    <div class="row g-2">
      <div class="col-md-6">
        <input id="searchInput" class="form-control"
          placeholder="Cari servis / status">
      </div>
      <div class="col-md-3">
        <select id="statusFilter" class="form-select">
          <option value="">Semua Status</option>
          <option value="pending">Pending</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-secondary w-100"
          onclick="applyFilter()">Tapis</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Tarikh</th>
            <th>Servis</th>
            <th>Jumlah</th>
            <th>Status</th>
            <th width="160">Tindakan</th>
          </tr>
        </thead>
        <tbody id="bookingTable"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/auth-guard-admin.js"></script>
<script src="js/pwa.js"></script>
<script src="js/admin-bookings.js"></script>
</body>
</html>
