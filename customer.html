<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Abang Kucing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ===== NAVBAR ===== -->
<nav class="navbar navbar-light shadow-sm">
  <div class="container">
    <span class="navbar-brand abang-kucing-logo">
      <span class="abang">Abang</span><span class="kucing">Kucing</span>
    </span>

    <button id="logoutBtn" class="btn btn-outline-secondary btn-sm">
      Logout
    </button>
  </div>
</nav>

<!-- ===== CONTENT ===== -->
<div class="container my-5">

  <!-- WELCOME -->
  <div class="mb-4">
    <h4>Welcome 👋</h4>
    <p class="text-muted mb-0">
      Manage your bookings, loyalty points & invoices here.
    </p>
  </div>

  <!-- ===== STATS ===== -->
  <div class="row g-3 mb-4">

    <!-- BOOKINGS -->
    <div class="col-md-4">
      <div class="card shadow-sm p-3 h-100">
        <h6>My Bookings</h6>
        <h3 id="bookingCount">0</h3>
        <a href="booking.html" class="small">
          Make a new booking →
        </a>
      </div>
    </div>

    <!-- LOYALTY -->
    <div class="col-md-4">
      <div class="card shadow-sm p-3 h-100">
        <h6>Loyalty Points</h6>
        <h3 id="loyaltyPoint">0</h3>
        <a href="loyalty.html" class="small">
          View rewards →
        </a>
      </div>
    </div>

    <!-- INVOICE -->
    <div class="col-md-4">
      <div class="card shadow-sm p-3 h-100">
        <h6>Latest Invoice</h6>
        <h3 id="latestInvoice">—</h3>
        <a href="invoice.html" class="small">
          View invoice →
        </a>
      </div>
    </div>

  </div>

  <!-- ===== RECENT BOOKINGS ===== -->
  <div class="card shadow-sm p-4">
    <h5 class="mb-3">Recent Bookings</h5>

    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
          <tr>
            <th>Date</th>
            <th>Service</th>
            <th>Status</th>
            <th class="text-end">Amount</th>
          </tr>
        </thead>
        <tbody id="bookingTable">
          <tr>
            <td colspan="4" class="text-muted text-center">
              No bookings yet
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- ===== FOOTER ===== -->
<footer class="mt-5 py-3 text-center text-muted small">
  © Abang Kucing
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
/* =====================================================
   CUSTOMER DASHBOARD DATA
   ===================================================== */

document.addEventListener('DOMContentLoaded', async () => {
  const { data: userData } = await supabaseClient.auth.getUser();
  if (!userData || !userData.user) {
    location.href = 'login.html';
    return;
  }

  const user = userData.user;

  /* ===== BOOKINGS ===== */
  const { data: bookings } = await supabaseClient
    .from('bookings')
    .select('service, status, amount, created_at')
    .order('created_at', { ascending: false })
    .limit(5);

  const table = document.getElementById('bookingTable');
  document.getElementById('bookingCount').textContent =
    bookings?.length || 0;

  if (bookings && bookings.length) {
    table.innerHTML = '';
    bookings.forEach(b => {
      table.innerHTML += `
        <tr>
          <td>${new Date(b.created_at).toLocaleDateString()}</td>
          <td>${b.service}</td>
          <td>
            <span class="badge ${
              b.status === 'pending' ? 'bg-warning' :
              b.status === 'confirmed' ? 'bg-success' :
              'bg-danger'
            }">
              ${b.status}
            </span>
          </td>
          <td class="text-end">RM${b.amount}</td>
        </tr>
      `;
    });

    document.getElementById('latestInvoice').textContent =
      'RM' + bookings[0].amount;
  }

  /* ===== LOYALTY ===== */
  const { data: loyalty } = await supabaseClient
    .from('loyalty_points')
    .select('points')
    .single();

  document.getElementById('loyaltyPoint').textContent =
    loyalty?.points ?? 0;
});

/* ===== LOGOUT ===== */
document.getElementById('logoutBtn').onclick = async () => {
  await supabaseClient.auth.signOut();
  location.href = 'login.html';
};
</script>

</body>
</html>
