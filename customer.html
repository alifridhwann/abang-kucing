<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Abang Kucing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3F51B5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="ak-app">

  <!-- Header -->
  <header class="ak-header">
    <div class="ak-header-inner">
      <div>
        <div class="ak-brand">
          <span class="abang">Abang</span><span class="kucing">Kucing</span>
        </div>
        <div class="ak-welcome">Hai, <span id="userName">Pelanggan</span></div>
      </div>
      <button id="logoutBtn" type="button" class="ak-btn-text">
        Keluar
      </button>
    </div>
  </header>

  <main class="ak-content">

    <!-- Stats -->
    <div class="ak-stats">
      <div class="ak-stat-box">
        <div class="ak-stat-num" id="bookingCount">0</div>
        <div class="ak-stat-lbl">Tempahan</div>
      </div>
      <div class="ak-stat-box ak-stat-box--gold">
        <div class="ak-stat-num" id="loyaltyPoint">0</div>
        <div class="ak-stat-lbl">Points</div>
      </div>
    </div>

    <!-- 4 Action Buttons -->
    <div class="ak-grid">
      <a href="booking" class="ak-grid-btn ak-grid-btn--primary">
        <i class="bi bi-calendar-plus ak-grid-icon"></i>
        <span class="ak-grid-label">Tempah</span>
      </a>
      <a href="loyalty" class="ak-grid-btn">
        <i class="bi bi-star ak-grid-icon"></i>
        <span class="ak-grid-label">Loyalty</span>
      </a>
      <a href="invoice" class="ak-grid-btn">
        <i class="bi bi-receipt ak-grid-icon"></i>
        <span class="ak-grid-label">Invoice</span>
      </a>
      <a href="profile" class="ak-grid-btn">
        <i class="bi bi-person ak-grid-icon"></i>
        <span class="ak-grid-label">Profil</span>
      </a>
    </div>

    <!-- Recent Bookings -->
    <section class="ak-section">
      <h2 class="ak-section-title">Tempahan Terkini</h2>
      
      <div id="bookingsList">
        <div class="ak-empty">
          <p>Tiada tempahan lagi</p>
        </div>
      </div>
    </section>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/nav.js"></script>
<script src="js/toast.js"></script>
<script src="js/security.js"></script>
<script src="js/pwa.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {
  const { data: userData } = await supabaseClient.auth.getUser();
  if (!userData || !userData.user) {
    go('login');
    return;
  }

  const user = userData.user;
  const meta = user.user_metadata || {};

  // Get name
  let name = meta.name || '';
  try {
    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('name')
      .eq('id', user.id)
      .maybeSingle();
    if (profile?.name) name = profile.name;
  } catch (e) {}

  document.getElementById('userName').textContent = 
    name || user.email?.split('@')[0] || 'Pelanggan';

  // Bookings
  const { data: bookings } = await supabaseClient
    .from('bookings')
    .select('service, status, amount, created_at')
    .eq('user_id', user.id)
    .order('created_at', { ascending: false })
    .limit(5);

  document.getElementById('bookingCount').textContent = bookings?.length || 0;

  const listEl = document.getElementById('bookingsList');
  if (bookings && bookings.length) {
    listEl.innerHTML = bookings.map(b => {
      const date = new Date(b.created_at);
      const dateStr = date.toLocaleDateString('ms-MY', { 
        day: 'numeric', month: 'short', year: 'numeric' 
      });
      
      const statusTxt = 
        b.status === 'pending' ? 'Menunggu' :
        b.status === 'in_progress' ? 'Sedang Diproses' :
        b.status === 'completed' ? 'Selesai' : 'Dibatalkan';
      
      const statusCls = 
        b.status === 'pending' ? 'pending' :
        b.status === 'in_progress' ? 'in-progress' :
        b.status === 'completed' ? 'completed' : 'cancelled';

      return `
        <div class="ak-booking-row">
          <div class="ak-booking-main">
            <div class="ak-booking-svc">${escapeHtml(b.service)}</div>
            <div class="ak-booking-date">${escapeHtml(dateStr)}</div>
          </div>
          <div class="ak-booking-side">
            <div class="ak-booking-amt">RM${escapeHtml(b.amount)}</div>
            <div class="ak-booking-sts ak-sts--${statusCls}">${escapeHtml(statusTxt)}</div>
          </div>
        </div>
      `;
    }).join('');
  }

  // Loyalty
  try {
    const { data: loyalty } = await supabaseClient
      .from('loyalty_points')
      .select('points')
      .eq('user_id', user.id)
      .maybeSingle();
    document.getElementById('loyaltyPoint').textContent = loyalty?.points ?? 0;
  } catch (e) {}
});

document.getElementById('logoutBtn').onclick = async () => {
  await supabaseClient.auth.signOut();
  toast.success('Berjaya log keluar');
  setTimeout(() => go('login'), 1000);
};
</script>

</body>
</html>
